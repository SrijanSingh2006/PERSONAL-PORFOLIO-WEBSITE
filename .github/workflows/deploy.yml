name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Publish dist to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach deploy refs/remotes/origin/gh-pages
          rsync -a --delete --exclude='.git' dist/ deploy/
          git -C deploy add -A
          if ! git -C deploy diff --cached --quiet; then
            git -C deploy commit -m "Deploy ${GITHUB_SHA}"
            git -C deploy push origin HEAD:gh-pages
          fi
